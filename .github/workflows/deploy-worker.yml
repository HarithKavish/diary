name: Deploy Worker

# Deploys the diary-api Worker (worker/) whenever it changes on main. The
# first deploy was done manually to bring the API up during initial
# development; this is what keeps every deploy after that declared in the
# repository rather than run from someone's machine (standards/DEPLOYMENT.md).
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      # Pinned to the commit SHA of cloudflare/wrangler-action v3 tag (9acf94ace14e7dc412b076f2c5c20b8ce93c79cd), resolved via `gh api repos/cloudflare/wrangler-action/git/ref/tags/v3` on 2026-10-12. Never pin a SHA you have not resolved.
      - name: Verify pinned SHA exists
        run: |
          expected_sha="9acf94ace14e7dc412b076f2c5c20b8ce93c79cd"
          actual_sha=$(gh api repos/cloudflare/wrangler-action/git/ref/tags/v3 --jq .object.sha 2>/dev/null || echo "FAILED")
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "ERROR: Pinned SHA verification failed"
            echo "Expected: $expected_sha"
            echo "Actual:   $actual_sha"
            exit 1
          fi
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: deploy
